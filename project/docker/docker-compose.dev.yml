version: '3.8'

services:
  client:
    build:
      context: ../apps/client
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000" # React Dev server
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    networks:
      - growth91
    volumes:
      - ../apps/client:/app
      - /app/node_modules
    stdin_open: true
    tty: true

 

networks:
  growth91:
    driver: bridge
